services:
  # ----------------------------------------------------------------------------
  # Single-Service Modular Monolith (FastAPI + React Static Assets)
  # ----------------------------------------------------------------------------
  - type: web
    name: campusmind-monolith
    env: python
    region: singapore
    plan: free
    buildCommand: ./build.sh
    startCommand: cd backend && python scripts/seed_canonical_db.py && python scripts/reset_and_seed_portal.py && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: campusmind-db
          property: connectionString

# ------------------------------------------------------------------------------
# Managed PostgreSQL Database Instance
# ------------------------------------------------------------------------------
databases:
  - name: campusmind-db
    databaseName: campusmind
    user: campusmind_user
    plan: free
    region: singapore
